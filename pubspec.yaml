name: preventivi_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # Pacchetti per Firebase
  firebase_core: any
  firebase_auth: any
  intl: ^0.20.1
  pdf: ^3.11.1
  path_provider: ^2.1.1
  printing: ^5.10.0
  js: ^0.6.3
  url_launcher: ^6.2.4
  open_file: ^3.2.1
  google_sign_in: ^6.1.5

  # Per le richieste HTTP al server
  http: any

  # Syncfusion libraries aggiornate e compatibili
  syncfusion_flutter_pdf: ^24.1.46
  syncfusion_flutter_datagrid: ^24.2.9
  universal_io: ^2.0.5
  universal_html: ^2.0.8

  # Librerie per aggiunta clienti da link
  share_plus: ^4.0.4
  fluttertoast: ^8.0.9

  # Librerie per l'invio email tramite le env e l'email di GMAIL
  mailer: ^6.0.0       # Per l'invio email
  flutter_dotenv: ^5.1.0 # Per nascondere le credenziali (opzionale ma consigliato)
  file_picker: ^5.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
 
 
flutter:
  uses-material-design: true
  assets:
    - assests/Logosimone.png
